name: Deploy to GitHub pages

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress Pages deployments when a new one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    # Deploying to Pages is only possible from the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
      # Redirect the Pages root to the crate's doc index.
      - run: echo '<meta http-equiv="refresh" content="0; url=generate_qgs/">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@v5
